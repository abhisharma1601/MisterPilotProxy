<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Neon cyan gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <!-- Neon magenta gradient -->
    <linearGradient id="magentaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF00AA"/>
      <stop offset="100%" stop-color="#FF0060"/>
    </linearGradient>
    <!-- Body gradient - dark synthwave -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0F0F23"/>
    </linearGradient>
    <!-- Purple accent -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B44CFF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Drop shadow for body -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bodyGrad)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Inner grid lines (funky synthwave grid) -->
  <line x1="24" y1="96" x2="24" y2="44" stroke="#B44CFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="40" y1="96" x2="40" y2="52" stroke="#B44CFF" stroke-width="0.5" opacity="0.15"/>
  <line x1="56" y1="96" x2="56" y2="48" stroke="#B44CFF" stroke-width="0.5" opacity="0.12"/>
  <line x1="72" y1="96" x2="72" y2="48" stroke="#B44CFF" stroke-width="0.5" opacity="0.12"/>
  <line x1="88" y1="96" x2="88" y2="52" stroke="#B44CFF" stroke-width="0.5" opacity="0.15"/>
  <line x1="104" y1="96" x2="104" y2="44" stroke="#B44CFF" stroke-width="0.5" opacity="0.2"/>

  <!-- Pilot wings - left -->
  <g filter="url(#glow)">
    <path d="M28 64 L8 44 L8 56 L20 64 L8 72 L8 84 Z" fill="url(#cyanGrad)" opacity="0.9"/>
    <!-- Wing detail lines -->
    <line x1="12" y1="55" x2="18" y2="62" stroke="#00F0FF" stroke-width="0.8" opacity="0.6"/>
    <line x1="10" y1="65" x2="18" y2="64" stroke="#00F0FF" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="73" x2="18" y2="66" stroke="#00F0FF" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Pilot wings - right -->
  <g filter="url(#glow)">
    <path d="M100 64 L120 44 L120 56 L108 64 L120 72 L120 84 Z" fill="url(#magentaGrad)" opacity="0.9"/>
    <!-- Wing detail lines -->
    <line x1="116" y1="55" x2="110" y2="62" stroke="#FF00AA" stroke-width="0.8" opacity="0.6"/>
    <line x1="118" y1="65" x2="110" y2="64" stroke="#FF00AA" stroke-width="0.8" opacity="0.6"/>
    <line x1="116" y1="73" x2="110" y2="66" stroke="#FF00AA" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- Gamepad body -->
  <g filter="url(#glowStrong)">
    <!-- D-pad cross -->
    <rect x="38" y="38" width="10" height="26" rx="2" fill="url(#cyanGrad)"/>
    <rect x="30" y="46" width="26" height="10" rx="2" fill="url(#cyanGrad)"/>
    <!-- D-pad center square -->
    <rect x="40" y="44" width="6" height="6" rx="1" fill="#1A1A2E"/>

    <!-- Action buttons (diamond layout) -->
    <!-- Top (Y / triangle) -->
    <polygon points="84,36 92,48 76,48" fill="url(#magentaGrad)"/>
    <!-- Right (B / circle) -->
    <circle cx="98" cy="56" r="6" fill="#FF0060"/>
    <!-- Bottom (A / cross) -->
    <polygon points="78,58 90,58 90,70 78,70" fill="#FF00AA"/>
    <!-- Left (X / square) -->
    <rect x="70" y="50" width="10" height="10" rx="1.5" fill="url(#purpleGrad)"/>

    <!-- Center menu buttons -->
    <rect x="60" y="62" width="3" height="3" rx="1.5" fill="#B44CFF" opacity="0.7"/>
    <rect x="65" y="62" width="3" height="3" rx="1.5" fill="#B44CFF" opacity="0.7"/>

    <!-- Shoulder buttons glow -->
    <rect x="32" y="28" width="16" height="6" rx="3" fill="url(#cyanGrad)" opacity="0.7"/>
    <rect x="80" y="28" width="16" height="6" rx="3" fill="url(#magentaGrad)" opacity="0.7"/>
  </g>

  <!-- Top funky accent line -->
  <rect x="40" y="18" width="48" height="3" rx="1.5" fill="url(#purpleGrad)" opacity="0.6"/>

  <!-- "MP" subtle brand in center-bottom -->
  <text x="64" y="102" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="url(#purpleGrad)" opacity="0.5">MP</text>
</svg>